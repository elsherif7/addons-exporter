<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../common/theme.js"></script>
<link rel="icon" href="../../icons/icon48.png">
<link rel="stylesheet" href="../common/shared.css">
<title>Add-ons Exporter</title>
<style>
  /* .about-block and .about-row come from shared.css, as does the
     entrance animation (.card and its children fade and rise in). */
</style></head>
<body>
  <div class="card">
    <h1 id="heading">Add-ons Exporter</h1>
    <p id="message">Thanks for using <strong>Add-ons Exporter</strong>. Your add-ons were exported as an <strong>HTML report</strong>. On another browser, choose <strong>Add-ons Importer</strong> to select which ones to install.</p>

    <div class="about-block">
      <div class="about-row">
        <span class="about-label">Rate this add-on</span>
        <span class="about-value"><a href="https://addons.mozilla.org/en-US/firefox/addon/add-ons-hub/" target="_blank" rel="noopener">Firefox Add-ons</a></span>
      </div>
      <div class="about-row">
        <span class="about-label">Report a bug / Request a feature</span>
        <span class="about-value"><a href="https://github.com/elsherif7/addons-hub/issues" target="_blank" rel="noopener">GitHub Issues</a></span>
      </div>
      <div class="about-row">
        <span class="about-label">GitHub Repository</span>
        <span class="about-value"><a href="https://github.com/elsherif7/addons-hub" target="_blank" rel="noopener">elsherif7/addons-hub</a></span>
      </div>
    </div>
  </div>
  <script src="../common/common.js"></script>
  <script src="../common/press.js"></script>
  <script src="confirmation.js"></script>
</body>
</html>
