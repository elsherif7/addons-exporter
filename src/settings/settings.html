<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="../common/theme.js"></script>
  <script src="../common/common.js"></script>
<link rel="icon" href="../icons/icon48.png">
<link rel="stylesheet" href="../common/shared.css">
<title>Add-ons Hub Settings</title>
<style>
  .settings-group {
    text-align: left;
    margin-bottom: 24px;
  }
  .settings-group h2 {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    margin: 0 0 10px;
  }
  .theme-option {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
    cursor: pointer;
    user-select: none;
    transition: background 0.12s, border-color 0.12s, transform 0.1s;
  }
  .theme-option:last-child { margin-bottom: 0; }
  .theme-option input { margin: 0; }
  .theme-option { font-size: 14px; }
  .theme-option:hover { background: var(--hover-bg); border-color: var(--btn-bg); transform: scale(1.01); }
  :root[data-theme="dark"] .theme-option:hover { background: #2e3340; border-color: #6b7280; }
  :root[data-theme="dark"] .settings-btn:hover { background: #2e3340; border-color: #6b7280; }
  .settings-action-group {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .settings-btn {
    flex: 1;
    padding: 9px 14px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    transition: background 0.12s, border-color 0.12s, transform 0.1s;
  }
  .settings-btn:hover { background: var(--hover-bg); border-color: var(--btn-bg-hover); transform: scale(1.01); }
  .settings-btn:active { transform: scale(0.99); }
  #settingsStatus {
    display: block;
    font-size: 13px;
    margin-top: 10px;
    min-height: 18px;
    color: var(--text-muted);
    text-align: center;
  }
  #settingsStatus.error { color: var(--danger-color); }
  .about-block {
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }
  .about-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    font-size: 14px;
    border-bottom: 1px solid var(--border-soft);
  }
  .about-row:last-child { border-bottom: none; }
  .about-label { color: var(--text-muted); }
  .about-value { color: var(--text); font-weight: 600; }
  .about-value a { color: var(--link-accent); text-decoration: none; font-weight: 600; }
  .about-value a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="card">
    <h1>Settings</h1>

    <div class="settings-group">
      <h2>Appearance</h2>
      <label class="theme-option" for="themeLight">
        <input type="radio" name="theme" id="themeLight" value="light">
        Light
      </label>
      <label class="theme-option" for="themeDark">
        <input type="radio" name="theme" id="themeDark" value="dark">
        Dark
      </label>
    </div>

    <div class="settings-group">
      <h2>Export Format</h2>
      <label class="theme-option" for="formatHtml">
        <input type="radio" name="exportFormat" id="formatHtml" value="html" checked>
        HTML
      </label>
      <label class="theme-option" for="formatJson">
        <input type="radio" name="exportFormat" id="formatJson" value="json">
        JSON
      </label>
      <label class="theme-option" for="formatCsv">
        <input type="radio" name="exportFormat" id="formatCsv" value="csv">
        CSV
      </label>
    </div>
    <div class="settings-group">
      <h2>Settings Backup</h2>
      <div class="settings-action-group">
        <button class="settings-btn" id="exportSettingsBtn">Export Settings</button>
        <button class="settings-btn" id="importSettingsBtn">Import Settings</button>
      </div>
      <span id="settingsStatus"></span>
    </div>

    <div class="settings-group">
      <h2>About</h2>
      <div class="about-block">
        <div class="about-row">
          <span class="about-label">Version</span>
          <span class="about-value">1.2.0</span>
        </div>
        <div class="about-row">
          <span class="about-label">Developer</span>
          <span class="about-value">Elsherif</span>
        </div>
        <div class="about-row">
          <span class="about-label">GitHub</span>
          <span class="about-value"><a href="https://github.com/elsherif7/addons-hub" target="_blank" rel="noopener">elsherif7/addons-hub</a></span>
        </div>
        <div class="about-row">
          <span class="about-label">Rate this extension</span>
          <span class="about-value"><a href="https://addons.mozilla.org/en-US/firefox/addon/add-ons-hub/" target="_blank" rel="noopener">Firefox Add-ons</a></span>
        </div>
        <div class="about-row">
          <span class="about-label">Report a bug / request a feature</span>
          <span class="about-value"><a href="https://github.com/elsherif7/addons-hub/issues" target="_blank" rel="noopener">GitHub Issues</a></span>
        </div>
        <div class="about-row">
          <span class="about-label">Check for updates</span>
          <span class="about-value"><button class="settings-btn" id="checkUpdateBtn">Check now</button></span>
        </div>
        <div class="about-row" id="updateStatusRow" style="display:none;">
          <span id="updateStatusMsg" style="font-size:13px;"></span>
        </div>
      </div>
    </div>
  </div>

  <input type="file" id="settingsFileInput" accept=".json" style="display:none">
  <script src="settings.js"></script>
</body>
</html>
