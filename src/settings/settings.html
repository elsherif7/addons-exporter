<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../common/theme.js"></script>
<link rel="icon" href="../icons/icon48.png">
<link rel="stylesheet" href="../common/shared.css">
<title>Add-ons Hub Settings</title>
<style>
  .settings-group {
    text-align: left;
    margin-bottom: 24px;
  }
  .settings-group h2 {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--text-muted);
    margin: 0 0 10px;
  }
  .theme-option {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
    cursor: pointer;
  }
  .theme-option:last-child { margin-bottom: 0; }
  .theme-option input { margin: 0; }
  .theme-option label { flex: 1; cursor: pointer; text-align: left; font-size: 14px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Settings</h1>

    <div class="settings-group">
      <h2>Appearance</h2>
      <div class="theme-option">
        <input type="radio" name="theme" id="themeLight" value="light">
        <label for="themeLight">Light</label>
      </div>
      <div class="theme-option">
        <input type="radio" name="theme" id="themeDark" value="dark">
        <label for="themeDark">Dark</label>
      </div>
    </div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
