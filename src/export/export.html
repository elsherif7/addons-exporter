<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="../common/theme.js"></script>
<link rel="icon" href="../icons/icon48.png">
<link rel="stylesheet" href="../common/shared.css">
<style>
  /* Opening reveal, top to bottom (see "staged" in shared.css): the page
     background, then the card, then the title, then each part in turn. */
  .card.staged > #exportDesc { --d: 0.7s; }
  .card.staged > .list-controls { --d: 0.82s; }
  .card.staged > .checklist-box { --d: 0.94s; }
  .card.staged > #exportSelectedBtn { --d: 1.06s; }
</style>
<title>Add-ons Exporter</title>
</head>
<body>
  <div class="card staged">
    <h1>Add-ons Exporter</h1>
    <p id="exportDesc">Select the <strong>Add-ons</strong> you want to export, then click <strong>Export Selected</strong> to create an <strong>HTML report</strong> you can use to reinstall them later on any Firefox&#8209;based&nbsp;browser.</p>

    <input type="search" id="searchInput" class="search-input" placeholder="Search add-ons..." aria-label="Search add-ons" style="display:none;">

    <div class="list-controls">
      <span>
        <button id="selectAllBtn" type="button">Select all</button>
        <button id="deselectAllBtn" type="button">Deselect all</button>
      </span>
      <span id="selectionCount" role="status" aria-live="polite"></span>
    </div>

    <div class="checklist-box">
      <div id="addonList">
        <p class="placeholder-text">Loading installed add-ons...</p>
      </div>
      <p id="noSearchMatches" class="placeholder-text" style="display:none;">No add-ons match your search.</p>
    </div>

    <button id="exportSelectedBtn" class="primary-btn hub-btn" disabled>Export Selected</button>
    <span id="status" role="status" aria-live="polite"></span>
  </div>

  <script src="../common/common.js"></script>
  <script src="../common/press.js"></script>
  <script src="export.js"></script>
</body>
</html>
