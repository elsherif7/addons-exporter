<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="../common/theme.js"></script>
  <style>
    /* Same variable names as shared.css, defined locally rather than
       loaded from it - popup.html is a separate document with its own
       distinct layout (fixed width, different padding/background), so
       it keeps its own self-contained styles rather than depending on
       shared.css, same as report-template.js's report does. */
    :root {
      --bg: #eff1f3;
      --card-bg: #fff;
      --text: #1f2937;
      --btn-bg: #1f2937;
      --btn-bg-hover: #111827;
      --btn-text: #fff;
      --border: #d0d3d9;
      --hover-bg: #fafbfc;
    }
    :root[data-theme="dark"] {
      --bg: #1a1c21;
      --card-bg: #24272e;
      --text: #e8e9ec;
      --btn-bg: #374151;
      --btn-bg-hover: #4b5563;
      --btn-text: #fff;
      --border: #3a3f4b;
      --hover-bg: #262a33;
    }
    /* body's light-mode #eff1f3 background is intentional, not drift -
       the popup was never meant to match the #f4f5f7 used on
       export.html/import.html/confirmation.html/the report. Don't "fix"
       this to match without checking first. */
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; width: 260px; margin: 0; padding: 16px; background: var(--bg); color: var(--text); box-sizing: border-box; overflow-wrap: break-word; }
    /* Firefox for Android shows this popup as a full-screen overlay rather
       than a small anchored dropdown, so the fixed 260px above would leave
       it pinned to a corner with the rest of the screen empty. popup.js
       adds this class after checking runtime.getPlatformInfo() - desktop's
       layout above is untouched either way. Fluid (min()/clamp()) rather
       than a flat cap, so it scales smoothly across any Android phone or
       tablet width instead of just looking right at one tested size. */
    /* Vertical padding uses vmin (not vw) so it scales down on short
       landscape viewports too - vw alone stays large even when height,
       not width, is what's actually constrained there. */
    body.android { width: 100%; max-width: min(92vw, 480px); margin: 0 auto; padding: clamp(20px, 6vmin, 36px) clamp(16px, 5vw, 24px); }
    body.android h3 { font-size: clamp(16px, 4.5vw, 20px); }
    body.android button { padding: clamp(10px, 3vw, 14px); font-size: clamp(14px, 3.5vw, 16px); }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px 16px;
      text-align: center;
    }
    h3 { margin-top: 0; margin-bottom: 14px; }
    button {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text);
      margin-bottom: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: background 0.12s, border-color 0.12s, transform 0.1s;
    }
    button:last-of-type { margin-bottom: 0; }
    button:hover { background: var(--hover-bg); border-color: var(--btn-bg-hover); transform: scale(1.02); }
    button:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="card">
    <h3>Add-ons Hub</h3>
    <button id="managerBtn">Add-ons Manager</button>
    <button id="exportBtn">Add-ons Exporter</button>
    <button id="importBtn">Add-ons Importer</button>
    <button id="settingsBtn">Settings</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
