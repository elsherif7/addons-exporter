<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <script src="../common/theme.js"></script>
  <style>
    /* Same variable names as shared.css, defined locally rather than
       loaded from it - popup.html is a separate document with its own
       distinct layout (fixed width, different padding/background), so
       it keeps its own self-contained styles rather than depending on
       shared.css, same as report-template.js's report does. */
    :root {
      --bg: #eff1f3;
      --card-bg: #fff;
      --text: #1f2937;
      --border: #747b87;
      --border-hover: #1f2937;
      --hover-bg: #fafbfc;
      /* Click/tap feedback ring (press.js). */
      --press-ring: rgba(0, 96, 223, 0.4);
      /* Spring easing: a real spring curve where linear() is supported,
         a plain overshoot curve otherwise. */
      --motion-spring: cubic-bezier(0.34, 1.4, 0.64, 1);
    }
    @supports (animation-timing-function: linear(0, 1)) {
      :root {
        --motion-spring: linear(0, 0.046, 0.163, 0.321, 0.495, 0.666, 0.819, 0.946, 1.042, 1.109, 1.147, 1.162, 1.159, 1.143, 1.118, 1.09, 1.062, 1.036, 1.014, 0.997, 0.985, 0.977, 0.974, 0.974, 0.976, 0.979, 0.984, 0.989, 1);
      }
    }
    :root[data-theme="dark"] {
      --bg: #1a1c21;
      --card-bg: #24272e;
      --text: #e8e9ec;
      --border: #70767f;
      --border-hover: #d1d5db;
      --hover-bg: #262a33;
      --press-ring: rgba(110, 168, 254, 0.5);
    }
    /* body's light-mode #eff1f3 background is intentional, not drift -
       the popup was never meant to match the #f4f5f7 used on
       export.html/import.html/confirmation.html/the report. Don't "fix"
       this to match without checking first. */
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; width: 260px; margin: 0; padding: 16px; background: var(--bg); color: var(--text); box-sizing: border-box; overflow-wrap: break-word; }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px 16px;
      text-align: center;
    }
    h3 { margin-top: 0; margin-bottom: 14px; }
    /* hub-btn: local copy of the shared button base (popup.html is
       self-contained and does not load shared.css). Keep in sync with
       .hub-btn in src/common/shared.css. */
    .hub-btn {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text);
      margin-bottom: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      user-select: none;
      /* The transform part is a springy release: pressed in quickly (see
         :active below), it bounces back out when let go. */
      transition: background 0.12s, border-color 0.12s, color 0.12s, transform 0.35s var(--motion-spring);
    }
    .hub-btn:last-of-type { margin-bottom: 0; }
    .hub-btn:hover { background: var(--hover-bg); border-color: var(--border-hover); transform: scale(1.02); }
    .hub-btn:active { transform: scale(0.95); transition-duration: 0.08s; }

    /* Opening reveal, one step after another (same idea as the Settings
       page, just quicker because the popup opens all the time): first only
       the popup background, then the empty card unfolds downward with a
       springy settle, then the title settles in as its letters tighten up,
       then the three buttons open outward from their centre one by one,
       top to bottom (about 1.4 seconds in total). backwards fill on
       purpose - everything stays hidden until its turn, and a held final
       keyframe would override :hover. */
    @keyframes popup-card-in {
      from { opacity: 0; transform: translateY(-16px) scale(0.9); clip-path: inset(0 0 100% 0 round 12px); }
      to   { opacity: 1; transform: none; clip-path: inset(-30px round 12px); }
    }
    @keyframes popup-title-in {
      from { opacity: 0; transform: translateY(10px); letter-spacing: 0.16em; }
      to   { opacity: 1; transform: none; letter-spacing: 0em; }
    }
    @keyframes popup-in {
      from { opacity: 0; transform: scale(0.94); clip-path: inset(0 50% 0 50% round 8px); }
      to   { opacity: 1; transform: none; clip-path: inset(-6px round 8px); }
    }
    .card {
      transform-origin: top center;
      animation: popup-card-in 0.55s var(--motion-spring) backwards;
      animation-delay: 0.12s;
    }
    h3 { animation: popup-title-in 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) backwards; }
    .hub-btn { animation: popup-in 0.55s var(--motion-spring) backwards; }
    h3 { animation-delay: 0.45s; }
    #exportBtn { animation-delay: 0.65s; }
    #importBtn { animation-delay: 0.8s; }
    #settingsBtn { animation-delay: 0.95s; }
    /* While things slide into place they can briefly stick out past the
       popup's edge, which flashed a scrollbar. Hide overflow for just the
       length of the reveal; it goes back to normal afterwards. */
    @keyframes popup-no-scroll {
      from, to { overflow: hidden; }
    }
    html { animation: popup-no-scroll 1.6s; }

    /* Light/dark switch (keep in sync with shared.css). Where the browser
       supports view transitions (Firefox 144+), theme.js wraps the theme
       change in document.startViewTransition(): the old page stays fully
       visible while the new theme fades in on top of it - a plain, clean
       cross-fade, with no blur or zoom. Everywhere else, theme.js adds
       .theme-switching to <html> for a moment instead, and every color
       glides from one theme to the other. Neither runs on first page load. */
    ::view-transition-old(root),
    ::view-transition-new(root) {
      mix-blend-mode: normal;
      animation-duration: 0.6s;
      animation-timing-function: ease-in-out;
    }
    ::view-transition-old(root) { animation: none; z-index: 1; }
    ::view-transition-new(root) { animation-name: hub-theme-in; z-index: 2; }
    @keyframes hub-theme-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    :root.theme-switching,
    :root.theme-switching *,
    :root.theme-switching *::before,
    :root.theme-switching *::after {
      transition: background-color 0.6s ease-in-out, color 0.6s ease-in-out,
        border-color 0.6s ease-in-out, box-shadow 0.6s ease-in-out,
        fill 0.6s ease-in-out, stroke 0.6s ease-in-out !important;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.001ms !important;
        animation-duration: 0.001ms !important;
        animation-delay: 0s !important;
      }
      .hub-btn:hover, .hub-btn:active { transform: none !important; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h3>Add-ons Hub</h3>
    <button id="exportBtn" class="hub-btn">Add-ons Exporter</button>
    <button id="importBtn" class="hub-btn">Add-ons Importer</button>
    <button id="settingsBtn" class="hub-btn">Settings</button>
  </div>
  <script src="../common/press.js"></script>
  <script src="popup.js"></script>
</body>
</html>
