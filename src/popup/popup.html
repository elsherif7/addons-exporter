<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <script src="../common/theme.js"></script>
  <style>
    /* Same variable names as shared.css, defined locally rather than
       loaded from it - popup.html is a separate document with its own
       distinct layout (fixed width, different padding/background), so
       it keeps its own self-contained styles rather than depending on
       shared.css, same as report-template.js's report does. */
    :root {
      --bg: #eff1f3;
      --card-bg: #fff;
      --text: #1f2937;
      --btn-bg: #1f2937;
      --btn-bg-hover: #111827;
      --border: #d0d3d9;
      --hover-bg: #fafbfc;
      /* Spring easing: a real spring curve where linear() is supported,
         a plain overshoot curve otherwise. */
      --spring: cubic-bezier(0.34, 1.4, 0.64, 1);
    }
    @supports (animation-timing-function: linear(0, 1)) {
      :root {
        --spring: linear(0, 0.046, 0.163, 0.321, 0.495, 0.666, 0.819, 0.946, 1.042, 1.109, 1.147, 1.162, 1.159, 1.143, 1.118, 1.09, 1.062, 1.036, 1.014, 0.997, 0.985, 0.977, 0.974, 0.974, 0.976, 0.979, 0.984, 0.989, 1);
      }
    }
    :root[data-theme="dark"] {
      --bg: #1a1c21;
      --card-bg: #24272e;
      --text: #e8e9ec;
      --btn-bg: #374151;
      --btn-bg-hover: #4b5563;
      --border: #3a3f4b;
      --hover-bg: #262a33;
    }
    /* body's light-mode #eff1f3 background is intentional, not drift -
       the popup was never meant to match the #f4f5f7 used on
       export.html/import.html/confirmation.html/the report. Don't "fix"
       this to match without checking first. */
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; width: 260px; margin: 0; padding: 16px; background: var(--bg); color: var(--text); box-sizing: border-box; overflow-wrap: break-word; }
    /* Firefox for Android shows this popup as a full-screen overlay rather
       than a small anchored dropdown, so the fixed 260px above would leave
       it pinned to a corner with the rest of the screen empty. popup.js
       adds this class after checking runtime.getPlatformInfo() - desktop's
       layout above is untouched either way. Fluid (min()/clamp()) rather
       than a flat cap, so it scales smoothly across any Android phone or
       tablet width instead of just looking right at one tested size. */
    /* Vertical padding uses vmin (not vw) so it scales down on short
       landscape viewports too - vw alone stays large even when height,
       not width, is what's actually constrained there. */
    body.android { width: 100%; max-width: min(92vw, 480px); margin: 0 auto; padding: clamp(20px, 6vmin, 36px) clamp(16px, 5vw, 24px); }
    body.android h3 { font-size: clamp(16px, 4.5vw, 20px); }
    body.android .hub-btn { padding: clamp(10px, 3vw, 14px); font-size: clamp(14px, 3.5vw, 16px); }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px 16px;
      text-align: center;
    }
    h3 { margin-top: 0; margin-bottom: 14px; }
    /* hub-btn: local copy of the shared button base (popup.html is
       self-contained and does not load shared.css). Keep in sync with
       .hub-btn in src/common/shared.css. */
    .hub-btn {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text);
      margin-bottom: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      user-select: none;
      transition: background 0.12s, border-color 0.12s, color 0.12s, transform 0.1s;
    }
    .hub-btn:last-of-type { margin-bottom: 0; }
    .hub-btn:hover { background: var(--hover-bg); border-color: var(--btn-bg-hover); transform: scale(1.02); }
    .hub-btn:active { transform: scale(0.98); }

    /* Entrance: the card drops in from the toolbar button with a springy
       overshoot, then the title and the three buttons spring up one after
       another (about a second in total). backwards fill on purpose - a
       held final keyframe would override :hover. */
    @keyframes popup-card-in {
      from { opacity: 0; transform: translateY(-30px) scale(0.8); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes popup-in {
      from { opacity: 0; transform: translateY(34px) scale(0.88); }
      to   { opacity: 1; transform: none; }
    }
    .card {
      transform-origin: top center;
      animation: popup-card-in 0.65s var(--spring) backwards;
    }
    h3, .hub-btn { animation: popup-in 0.6s var(--spring) backwards; }
    h3 { animation-delay: 0.12s; }
    #exportBtn { animation-delay: 0.22s; }
    #importBtn { animation-delay: 0.32s; }
    #settingsBtn { animation-delay: 0.42s; }

    /* Light/dark switch (keep in sync with shared.css). Where the browser
       supports view transitions (Firefox 144+), theme.js wraps the theme
       change in document.startViewTransition(): the old page stays fully
       visible while the new theme fades in on top of it - a plain, clean
       cross-fade, with no blur or zoom. Everywhere else, theme.js adds
       .theme-switching to <html> for a moment instead, and every color
       glides from one theme to the other. Neither runs on first page load. */
    ::view-transition-old(root),
    ::view-transition-new(root) {
      mix-blend-mode: normal;
      animation-duration: 0.6s;
      animation-timing-function: ease-in-out;
    }
    ::view-transition-old(root) { animation: none; z-index: 1; }
    ::view-transition-new(root) { animation-name: hub-theme-in; z-index: 2; }
    @keyframes hub-theme-in {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    :root.theme-switching,
    :root.theme-switching *,
    :root.theme-switching *::before,
    :root.theme-switching *::after {
      transition: background-color 0.6s ease-in-out, color 0.6s ease-in-out,
        border-color 0.6s ease-in-out, box-shadow 0.6s ease-in-out,
        fill 0.6s ease-in-out, stroke 0.6s ease-in-out !important;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0.001ms !important;
        animation-duration: 0.001ms !important;
      }
      .hub-btn:hover, .hub-btn:active { transform: none !important; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h3>Add-ons Hub</h3>
    <button id="exportBtn" class="hub-btn">Add-ons Exporter</button>
    <button id="importBtn" class="hub-btn">Add-ons Importer</button>
    <button id="settingsBtn" class="hub-btn">Settings</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
