<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; width: 260px; margin: 0; padding: 16px; background: #eff1f3; box-sizing: border-box; overflow-wrap: break-word; }
    /* Firefox for Android shows this popup as a full-screen overlay rather
       than a small anchored dropdown, so the fixed 260px above would leave
       it pinned to a corner with the rest of the screen empty. popup.js
       adds this class after checking runtime.getPlatformInfo() - desktop's
       layout above is untouched either way. Fluid (min()/clamp()) rather
       than a flat cap, so it scales smoothly across any Android phone or
       tablet width instead of just looking right at one tested size. */
    /* Vertical padding uses vmin (not vw) so it scales down on short
       landscape viewports too - vw alone stays large even when height,
       not width, is what's actually constrained there. */
    body.android { width: 100%; max-width: min(92vw, 480px); margin: 0 auto; padding: clamp(20px, 6vmin, 36px) clamp(16px, 5vw, 24px); }
    body.android h3 { font-size: clamp(16px, 4.5vw, 20px); }
    body.android button { padding: clamp(10px, 3vw, 14px); font-size: clamp(14px, 3.5vw, 16px); }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px 16px;
      text-align: center;
    }
    h3 { margin-top: 0; margin-bottom: 14px; }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #1f2937;
      color: #fff;
      margin-bottom: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }
    button:last-of-type { margin-bottom: 0; }
    button:hover { background: #111827; }
  </style>
</head>
<body>
  <div class="card">
    <h3>Add-ons Hub</h3>
    <button id="exportBtn">Add-ons Exporter</button>
    <button id="importBtn">Add-ons Importer</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
