<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; width: 260px; margin: 0; padding: 16px; background: #eff1f3; }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 20px 16px;
      text-align: center;
    }
    h3 { margin-top: 0; margin-bottom: 14px; }
    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #1f2937;
      color: #fff;
      margin-bottom: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }
    button:last-of-type { margin-bottom: 0; }
    button:hover { background: #111827; }
  </style>
</head>
<body>
  <div class="card">
    <h3>Add-ons Exporter</h3>
    <button id="exportBtn">Export Add-ons</button>
    <button id="importBtn">Import Add-ons</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
