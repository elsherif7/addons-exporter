<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="icon" href="icons/icon48.png">
<title>Add-ons Exporter</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    max-width: 600px;
    margin: 80px auto;
    text-align: center;
    color: #222;
  }
  h1 { font-size: 28px; margin-bottom: 30px; }
  p { font-size: 16px; color: #444; line-height: 1.7; }
  a { color: #1a73e8; text-decoration: none; display: block; margin: 18px 0; }
  a:hover { text-decoration: underline; }
  code {
    background: #f0f0f0;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 14px;
  }
</style>
</head>
<body>
  <h1>Add-ons Exporter</h1>
  <p id="message">Thanks for using <strong>Add-ons Exporter!</strong> Your add-ons list has been exported as <strong>Firefox-Addons.html</strong> to the location you chose. Use "Import Add-ons" on another browser to open them all.</p>

  <a href="https://addons.mozilla.org/en-US/firefox/addon/addons-exporter/" target="_blank" rel="noopener">Rate this extension on Firefox Add-ons</a>
  <a href="https://github.com/elsherif7/addons-exporter/issues" target="_blank" rel="noopener">Report bugs or request a new feature</a>
  <a href="https://github.com/elsherif7/addons-exporter" target="_blank" rel="noopener">GitHub repository</a>

  <script src="confirmation.js"></script>
