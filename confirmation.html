<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="icon" href="icons/icon48.png">
<title>Add-ons Exporter</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: #f4f5f7;
    margin: 0;
    padding: 60px 20px;
    color: #222;
  }
  .card {
    max-width: 560px;
    margin: 0 auto;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    padding: 40px;
    text-align: center;
  }
  h1 { font-size: 28px; margin: 0 0 16px; }
  p { font-size: 16px; color: #444; line-height: 1.7; margin: 0 0 28px; }
  a { color: #1a73e8; text-decoration: none; display: block; margin: 18px 0; }
  a:hover { text-decoration: underline; }
</style></head>
<body>
  <div class="card">
    <h1>Add-ons Exporter</h1>
    <p>Thanks for using <strong>Add-ons Exporter!</strong> Your add-ons list has been exported as an HTML report to the location you chose. Use "Import Add-ons" on another browser to open them all.</p>

    <a href="https://addons.mozilla.org/en-US/firefox/addon/add-ons-exporter/" target="_blank" rel="noopener">Rate this extension on Firefox Add-ons</a>
    <a href="https://github.com/elsherif7/addons-exporter/issues" target="_blank" rel="noopener">Report bugs or request a new feature</a>
    <a href="https://github.com/elsherif7/addons-exporter" target="_blank" rel="noopener">GitHub repository</a>
  </div>
</body>
</html>
