<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="icon" href="icons/icon48.png">
<link rel="stylesheet" href="shared.css">
<title>Add-ons Exporter</title>
<style>
  .card { max-width: 640px; }
</style>
</head>
<body>
  <div class="card">
    <h1>Add-ons Exporter</h1>
    <p>Select the <strong>Add-ons</strong> you want to export, then click <strong>Export Selected</strong> to create a report you can use to reinstall them later, on this browser or another Firefox-based one.</p>

    <input type="search" id="searchInput" class="search-input" placeholder="Search add-ons..." style="display:none;">

    <div class="list-controls">
      <span>
        <button id="selectAllBtn" type="button">Select all</button>
        <button id="deselectAllBtn" type="button">Deselect all</button>
      </span>
      <span id="selectionCount"></span>
    </div>

    <div class="checklist-box">
      <div id="addonList">
        <p class="placeholder-text">Loading installed add-ons...</p>
      </div>
      <p id="noSearchMatches" class="placeholder-text" style="display:none;">No add-ons match your search.</p>
    </div>

    <button id="exportSelectedBtn" class="primary-btn" disabled>Export Selected</button>
    <span id="status"></span>
  </div>

  <script src="common.js"></script>
  <script src="export.js"></script>
</body>
</html>
